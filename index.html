    <link rel="stylesheet" href="/src/app.css">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // IIFE to set theme class on <html>
      (function() {
        const theme = localStorage.getItem('theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (theme === 'dark' || (!theme && prefersDark)) {
          document.documentElement.classList.add('dark');
        }
      })();

      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              'navy': '#0a192f',
              'dark-bg-section': '#020c1b', 
              'slate': '#ccd6f6', // Brighter, higher-contrast gray for dark mode text
              'light-slate': '#f8f9fa', // Warmer off-white for light mode sections
              'white': '#FFFFFF',
              'gold': '#d4af37',
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              serif: ['Cormorant Garamond', 'serif'],
              logo: ['Playfair Display', 'serif'],
            },
          },
        },
        plugins: [
          function({ addUtilities }) {
            const newUtilities = {
              '.text-shadow-subtle': {
                textShadow: '0 2px 8px rgba(0, 0, 0, 0.5)',
              },
              '.box-shadow-gold': {
                boxShadow: '0 0 25px 10px rgba(212, 175, 55, 0.35), 0 0 10px 4px rgba(212, 175, 55, 0.25)',
              },
              '.text-glow-white': {
                textShadow: '0 0 8px rgba(255, 255, 255, 0.8), 0 0 2px rgba(255, 255, 255, 0.8)',
              },
            }
            addUtilities(newUtilities)
          }
        ]
      }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",

        "telephone": "+917845423555",
        "contactType": "customer service"
      }
    }
    </script>
